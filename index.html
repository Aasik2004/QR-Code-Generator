<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator & Downloader</title>
  <!-- QRCode.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* ---------- RESET & GLOBAL ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #f5f7fa 0%, #e9edf2 100%);
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
      padding: 2.5rem 2rem;
      max-width: 520px;
      width: 100%;
      transition: 0.3s;
    }
    h1 {
      font-weight: 600;
      font-size: 1.9rem;
      color: #1a2639;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.1rem;
    }
    .sub {
      color: #5d6f88;
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
      border-left: 4px solid #3b82f6;
      padding-left: 0.8rem;
    }
    /* ---------- INPUT ---------- */
    .input-group {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .input-group input {
      flex: 1;
      min-width: 180px;
      padding: 0.8rem 1.2rem;
      border: 2px solid #dce1e9;
      border-radius: 60px;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
      background: #f8fafc;
    }
    .input-group input:focus {
      border-color: #3b82f6;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }
    .input-group button {
      padding: 0.8rem 1.8rem;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: 600;
      border-radius: 60px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
      white-space: nowrap;
    }
    .input-group button:hover {
      background: #2563eb;
      transform: scale(1.02);
    }
    .input-group button:active {
      transform: scale(0.96);
    }
    .input-group button.secondary {
      background: #e2e8f0;
      color: #1e293b;
    }
    .input-group button.secondary:hover {
      background: #cbd5e1;
    }
    /* ---------- QR DISPLAY ---------- */
    .qr-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      padding: 1rem;
      border-radius: 1.5rem;
      border: 2px dashed #dce1e9;
      min-height: 210px;
      margin-bottom: 1.2rem;
      transition: 0.3s;
    }
    .qr-wrapper #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .qr-wrapper #qrcode canvas,
    .qr-wrapper #qrcode img {
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
    }
    .placeholder-text {
      color: #94a3b8;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }
    /* ---------- ACTIONS ---------- */
    .actions {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .actions button {
      flex: 1;
      min-width: 120px;
      padding: 0.8rem 1.2rem;
      border: none;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      background: #f1f5f9;
      color: #1e293b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .actions button.primary {
      background: #0f172a;
      color: white;
    }
    .actions button.primary:hover {
      background: #1e293b;
      transform: translateY(-2px);
    }
    .actions button.primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .actions button.download {
      background: #22c55e;
      color: white;
    }
    .actions button.download:hover {
      background: #16a34a;
      transform: translateY(-2px);
    }
    .actions button.download:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .actions button.clear {
      background: #f1f5f9;
      color: #475569;
    }
    .actions button.clear:hover {
      background: #e2e8f0;
    }
    /* ---------- TOAST / STATUS ---------- */
    .status {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.9rem;
      color: #475569;
      min-height: 1.6rem;
      transition: 0.2s;
    }
    .status.success {
      color: #16a34a;
    }
    .status.error {
      color: #dc2626;
    }
    /* responsive */
    @media (max-width: 480px) {
      .card {
        padding: 1.5rem 1rem;
      }
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 QR Code</h1>
    <div class="sub">Generate & download instantly</div>

    <!-- Input area -->
    <div class="input-group">
      <input type="text" id="textInput" placeholder="Enter text or URL…" autofocus />
      <button id="generateBtn">Generate</button>
      <button id="clearBtn" class="secondary" title="Clear input and QR">✕</button>
    </div>

    <!-- QR display -->
    <div class="qr-wrapper">
      <div id="qrcode">
        <span class="placeholder-text">Your QR will appear here</span>
      </div>
    </div>

    <!-- Action buttons -->
    <div class="actions">
      <button id="downloadBtn" class="download" disabled>⬇ Download PNG</button>
      <button id="resetBtn" class="clear">⟲ Reset</button>
    </div>

    <div id="status" class="status">💡 Type something and hit Generate</div>
  </div>

  <script>
    (function() {
      // ----- DOM refs -----
      const input = document.getElementById('textInput');
      const generateBtn = document.getElementById('generateBtn');
      const clearBtn = document.getElementById('clearBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const qrContainer = document.getElementById('qrcode');

      let currentQR = null;          // holds the QRCode instance
      let currentText = '';          // last generated text

      // ----- helpers -----
      function setStatus(msg, type = '') {
        status.textContent = msg;
        status.className = 'status' + (type ? ' ' + type : '');
      }

      // Clear QR from container (remove canvas and any children)
      function clearQR() {
        if (currentQR) {
          // QRCode instance doesn't have a destroy, so we remove its canvas
          const canvas = qrContainer.querySelector('canvas');
          if (canvas) canvas.remove();
          // also remove any img tags if present (some libs generate img)
          const imgs = qrContainer.querySelectorAll('img');
          imgs.forEach(img => img.remove());
          currentQR = null;
        } else {
          // ensure container is emptied (but keep placeholder if needed)
          qrContainer.innerHTML = '<span class="placeholder-text">Your QR will appear here</span>';
        }
        downloadBtn.disabled = true;
        currentText = '';
        // remove any leftover text nodes
        // We'll handle it cleanly
      }

      // Generate QR from given text
      function generateQR(text) {
        if (!text || text.trim() === '') {
          setStatus('⚠️ Please enter some text or URL.', 'error');
          clearQR();
          return false;
        }

        // Clear previous QR
        clearQR();

        // Create new QRCode instance
        try {
          // Use the global QRCode constructor (from CDN)
          currentQR = new QRCode(qrContainer, {
            text: text,
            width: 200,
            height: 200,
            colorDark: '#0f172a',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H   // highest error correction
          });
          currentText = text;
          downloadBtn.disabled = false;
          setStatus(`✅ QR generated for "${text}"`, 'success');
          // Store in localStorage
          localStorage.setItem('qr_last_text', text);
          return true;
        } catch (e) {
          setStatus('❌ Error generating QR: ' + e.message, 'error');
          clearQR();
          return false;
        }
      }

      // Download the QR code as PNG
      function downloadQR() {
        if (!currentQR) {
          setStatus('⚠️ No QR to download. Generate one first.', 'error');
          return;
        }
        // Get the canvas element inside the container
        const canvas = qrContainer.querySelector('canvas');
        if (!canvas) {
          setStatus('⚠️ Canvas not found. Please regenerate.', 'error');
          return;
        }
        try {
          // Create download link
          const link = document.createElement('a');
          link.download = `qrcode_${Date.now()}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          setStatus('📥 Download started!', 'success');
        } catch (e) {
          setStatus('❌ Download failed: ' + e.message, 'error');
        }
      }

      // Reset everything
      function resetAll() {
        input.value = '';
        clearQR();
        setStatus('✨ Reset. Type something and Generate.', '');
        localStorage.removeItem('qr_last_text');
        input.focus();
      }

      // ----- Event listeners -----
      generateBtn.addEventListener('click', function() {
        const text = input.value.trim();
        generateQR(text);
      });

      // Enter key on input triggers generate
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          generateBtn.click();
        }
      });

      clearBtn.addEventListener('click', function() {
        input.value = '';
        clearQR();
        setStatus('✏️ Input cleared. Type new text.', '');
        input.focus();
      });

      downloadBtn.addEventListener('click', downloadQR);

      resetBtn.addEventListener('click', resetAll);

      // ----- On load: restore last generated text from localStorage -----
      function init() {
        const saved = localStorage.getItem('qr_last_text');
        if (saved) {
          input.value = saved;
          generateQR(saved);
        } else {
          // show placeholder
          clearQR();
          setStatus('💡 Type something and hit Generate', '');
        }
        input.focus();
      }

      init();
    })();
  </script>
</body>
</html>
